apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  annotations:
    # Avant LiteLLM (wave 2) dont l'Ingress utilise la classe "nginx"
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.15.1
    helm:
      releaseName: ingress-nginx
      valuesObject:
        controller:
          ingressClassResource:
            name: nginx
          # minikube : pas de LoadBalancer sans "minikube tunnel" (le Service
          # resterait <pending> et l'app Argo en Progressing). NodePort fixe à la place.
          service:
            type: NodePort
            nodePorts:
              http: 30080
              https: 30443
          # Métriques scrapées par kube-prometheus-stack (wave -1)
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
