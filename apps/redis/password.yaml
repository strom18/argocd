# Mot de passe Redis généré aléatoirement par External Secrets, une seule fois.
# Résultat : Secret "redis-auth" (clé "password"), utilisé par replication.yaml.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: redis-password
  namespace: redis
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  length: 32
  digits: 8
  # Pas de symboles : évite les soucis d'échappement dans les URL redis://
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-auth
  namespace: redis
  annotations:
    # Le Secret doit exister avant les pods Redis
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # Généré à la création puis jamais modifié (sinon rotation à chaque refresh)
  refreshPolicy: CreatedOnce
  target:
    name: redis-auth
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: redis-password
