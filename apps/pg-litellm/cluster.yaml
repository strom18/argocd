apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-litellm
  namespace: db
  annotations:
    # Permet à ArgoCD de synchroniser même si la CRD n'est pas encore connue
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  instances: 2
  storage:
    size: 10Gi
    # Provisioner multi-nœud (minikube: addon csi-hostpath-driver).
    # "standard" (minikube-hostpath) ne prépare les volumes que sur le control-plane.
    storageClass: csi-hostpath-sc
  bootstrap:
    initdb:
      database: litellm
      owner: litellm
      # Pas de secret fourni : CNPG génère "pg-litellm-app"
      # (clés username, password, host, uri, ...) -> rien de sensible dans Git
