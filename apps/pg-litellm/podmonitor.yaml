# Scrape l'exporter intégré à chaque instance PostgreSQL (port "metrics", 9187).
# Créé à la main : spec.monitoring.enablePodMonitor du Cluster est déprécié.
# CRD PodMonitor fournie par kube-prometheus-stack (wave -1).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: pg-litellm
  namespace: db
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: pg-litellm
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
