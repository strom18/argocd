# Values du chart oci://ghcr.io/berriai/litellm/chart/litellm (argocd/templates/litellm.yaml)
# Prérequis (hors Git, créés par la CI/CD) dans le namespace litellm :
#   litellm-masterkey (masterkey), litellm-db (username, password),
#   litellm-env (REDIS_PASSWORD, LITELLM_SALT_KEY)

gateway:
  extraEnv: &commonEnv
    # Désactive le chargement d'un fichier .env au démarrage du proxy
    - name: LITELLM_MODE
      value: "PRODUCTION"
    # Clé de chiffrement des credentials stockés en base : ne JAMAIS la changer
    # une fois des modèles/clés enregistrés, sinon ils deviennent illisibles.
    - name: LITELLM_SALT_KEY
      valueFrom:
        secretKeyRef:
          name: litellm-env
          key: LITELLM_SALT_KEY
  # Sidecar qui expose /metrics (service <gateway>-metrics), requis par le ServiceMonitor
  metricsServer:
    enabled: true
  # Scrapé par Prometheus (kube-prometheus-stack)
  serviceMonitor:
    enabled: true
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # Nécessitent prometheus-adapter (custom.metrics.k8s.io), sinon HPA en erreur :
    # targetRequestsPerSecond: "90"
    # targetTokensPerSecond: "6M"
  config:
    proxy_config:
      general_settings:
        proxy_batch_write_at: 60
        store_model_in_db: true
        proxy_config_reload_interval_seconds: 30
        database_connection_pool_limit: 20
        disable_error_logs: true
      litellm_settings:
        request_timeout: 600
        set_verbose: false
        json_logs: true

# Le backend (API d'admin) lit/écrit aussi les credentials chiffrés
backend:
  extraEnv: *commonEnv

masterKey:
  secretName: litellm-masterkey
  secretKey: masterkey

database:
  writer:
    host: "pg-litellm-rw.db.svc.cluster.local"
    port: 5432
    dbname: litellm
    passwordSecret:
      name: litellm-db
      usernameKey: username
      passwordKey: password
  # optional: add database.reader to route reads to a replica

redis:
  host: "redis-master.redis.svc.cluster.local"
  port: 6379
  passwordSecret:
    name: litellm-env
    passwordKey: REDIS_PASSWORD

# one host fronting gateway, backend, and ui
ingress:
  enabled: true
  className: "nginx"
  # alb (default) or nginx. ingress-nginx's admission webhook rejects the chart's
  # dotted paths (/favicon.ico, /eu.assemblyai) unless this is nginx
  controller: nginx
  host: llm.local
  # optional: routes the chart does not ship a rule for, e.g. a passthrough
  # prefix added after this chart version or a custom
  # general_settings.pass_through_endpoints path. Additive: every built-in
  # UI, gateway, and backend path is still rendered
  extraPaths:
    - path: /watsonx
      pathType: Prefix     # default; Exact and ImplementationSpecific also work
      service: gateway     # default; backend and ui also work
    - path: /index.txt
      pathType: Exact
      service: ui
